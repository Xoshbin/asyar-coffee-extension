<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
<!-- Background Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- 1px Specular Bevel -->
    

    <!-- Hero Drop Shadow -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#271003" flood-opacity="0.6" />
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FDE68A" flood-opacity="0.7" />
    </filter>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Solid Flat Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#D97706" />

  <!-- Calibrated Glyph (~19% Optical Margin Sweet-Spot) -->
  <g transform="translate(-30.72 -30.72) scale(1.12)">

<!-- Hero Content with Drop Shadow -->
  <g filter="url(#heroShadow)">
    <!-- Awake Spark (✦) at the top -->
    <path d="M 256, 122 Q 256, 138 272, 138 Q 256, 138 256, 154 Q 256, 138 240, 138 Q 256, 138 256, 122 Z"
          fill="#FFFBEB" filter="url(#starGlow)" />
    <!-- Secondary small sparkle -->
    <path d="M 306, 142 Q 306, 150 314, 150 Q 306, 150 306, 158 Q 306, 150 298, 150 Q 306, 150 306, 142 Z"
          fill="#FDE68A" opacity="0.8" />

    <!-- Awake Broadcast Energy Waves -->
    <path d="M 212, 180 C 228, 162 284, 162 300, 180" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 226, 204 C 238, 192 274, 192 286, 204" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M 238, 226 C 246, 218 266, 218 274, 226" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Saucer plate -->
    <ellipse cx="256" cy="376" rx="124" ry="16" fill="#FFFFFF" />
    <ellipse cx="256" cy="376" rx="92" ry="10" fill="none" stroke="#D97706" stroke-width="2" stroke-opacity="0.25" />

    <!-- Cup Handle (right side) -->
    <path d="M 326, 286 C 386, 286 392, 342 320, 348" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M 172, 274
             C 172, 356 208, 370 256, 370
             C 304, 370 340, 356 340, 274 Z"
          fill="#FFFFFF" />

    <!-- Coffee surface inside cup -->
    <ellipse cx="256" cy="274" rx="84" ry="18" fill="#451A03" />
    <!-- Rich golden crema layer -->
    <ellipse cx="256" cy="274" rx="68" ry="13" fill="#92400E" opacity="0.85" />
    <ellipse cx="242" cy="272" rx="36" ry="6" fill="#F59E0B" opacity="0.4" />
  </g>
  </g>

  <!-- 2px Specular Rim Stroke -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
</svg>